name: unpack-site
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack site.zip
        run: |
          if [ -f site.zip ]; then
            mkdir -p /tmp/site
            unzip -oq site.zip -d /tmp/site
            cp -rf /tmp/site/. .
            rm -f site.zip
            rm -f .github/workflows/unpack.yml
            git config user.name "site-unpack-bot"
            git config user.email "site-unpack-bot@users.noreply.github.com"
            git add -A
            git commit -m "Add Junxian display static site files" || true
            git push
          fi
